name: Build Tweak

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Link Xcode SDK
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK"
          ln -s "$SDK" $HOME/theos/sdks/iPhoneOS.sdk
          echo "TARGET=iphone:clang:iPhoneOS:14.0" >> $GITHUB_ENV

      - name: Build
        run: |
          export THEOS=$HOME/theos
          export TARGET=iphone:clang:iPhoneOS:14.0
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: BlueeMods-deb
          path: packages/*.deb
          if-no-files-found: error
