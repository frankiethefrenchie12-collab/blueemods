name: Build BlueeMods Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Xcode tools
        run: xcode-select --install || true

      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK"
          clang -arch arm64 \
            -isysroot $SDK \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -o BlueeMods.dylib \
            BlueeMods/BlueeModsWindow.mm

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: BlueeMods-dylib
          path: BlueeMods.dylib
          if-no-files-found: error
