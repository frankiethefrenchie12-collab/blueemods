name: Build BlueeMods Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: theos/theos-action@main
        with:
          theos-sdks-path: ./theos/sdks

      - name: Build
        run: make package FINALPACKAGE=1
        env:
          THEOS: ${{ env.THEOS }}

      - name: Find build artifacts
        run: |
          echo "=== Packages ==="
          find . -name "*.deb" 2>/dev/null
          echo "=== Dylibs ==="
          find . -name "*.dylib" 2>/dev/null

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: BlueeMods-deb
          path: packages/*.deb
          if-no-files-found: warn

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: BlueeMods-dylib
          path: .theos/**/*.dylib
          if-no-files-found: warn
