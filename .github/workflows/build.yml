name: Build BlueeMods Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Install iOS SDK
        run: |
          curl -LO https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          mkdir -p $THEOS/sdks
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          make package
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueeMods-dylib
          path: |
            .theos/obj/debug/BlueeMods.dylib
            packages/*.deb
          if-no-files-found: warn
