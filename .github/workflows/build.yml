name: Build BlueeMods Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz
          
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK
        run: |
          curl -LO https://github.com/theos/sdks/releases/download/v1/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $HOME/theos/sdks/

      - name: Build
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1

      - name: Find artifacts
        run: |
          find . -name "*.deb" -o -name "*.dylib" 2>/dev/null

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: BlueeMods-deb
          path: packages/*.deb
          if-no-files-found: warn

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: BlueeMods-dylib
          path: .theos/**/*.dylib
          if-no-files-found: warn
